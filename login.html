<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./local_library_24dp_5985E1_FILL0_wght400_GRAD0_opsz24.png">
    <title>Login</title>
    <link rel="stylesheet" href="./login.css" />
    
  </head>
  <body>
    <main>
      <form id="login-form" novalidate>
        <div class="form-title">
          <div class="icon-class">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              height="24px"
              viewBox="0 -960 960 960"
              width="24px"
              fill="#ffffff"
            >
              <path
                d="M480-60q-72-68-165-104t-195-36v-440q101 0 194 36.5T480-498q73-69 166-105.5T840-640v440q-103 0-195.5 36T480-60Zm0-104q63-47 134-75t146-37v-276q-73 13-143.5 52.5T480-394q-66-66-136.5-105.5T200-552v276q75 9 146 37t134 75ZM367-647q-47-47-47-113t47-113q47-47 113-47t113 47q47 47 47 113t-47 113q-47 47-113 47t-113-47Zm169.5-56.5Q560-727 560-760t-23.5-56.5Q513-840 480-840t-56.5 23.5Q400-793 400-760t23.5 56.5Q447-680 480-680t56.5-23.5ZM480-760Zm0 366Z"
              />
            </svg>
          </div>
          <h2>QBank</h2>
        </div>
        <p class="student-access">Student Access</p>
        <h1 class="welcome-back">Welcome Back</h1>
        <p class="enter-details">Enter your details to continue to your academic resources.</p>
        <div class="details">
          <div class="email">
            <label for="email">Email</label>
            <input type="text" id="email" name="email" placeholder="Enter student email" />
            <p id="email-error"></p>
          </div>
          <div class="password">
            <label for="password">Password</label>
            <input
              type="password"
              name="password"
              id="password"
              placeholder="Enter at least 8 characters"
            />
            <p id="password-error"></p>
          </div>
        </div>
        <button id="loginbutton" type="submit">Login</button>
      </form>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
